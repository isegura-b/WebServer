<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>403 Prohibido</title>

  <style>
    :root{
      --bg:#0b1020;
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --border:rgba(255,255,255,.12);
      --shadow:0 20px 60px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;
      min-height:100vh;
      padding:24px;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:var(--text);
      background-color:var(--bg);
      background-image:
        radial-gradient(900px 500px at 10% 10%, rgba(91,195,255,.25), transparent 55%),
        radial-gradient(700px 500px at 90% 80%, rgba(176,91,255,.2), transparent 55%);
      background-repeat:no-repeat;
      background-attachment:fixed;
      background-size:cover;
      display:grid;
      place-items:center;
    }
    .card{
      width:min(900px,100%);
      padding:22px;
      border-radius:18px;
      border:1px solid var(--border);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      box-shadow:var(--shadow);
    }
    .badge{
      display:inline-flex;
      gap:10px;
      align-items:center;
      padding:6px 10px;
      border:1px solid var(--border);
      border-radius:999px;
      color:var(--muted);
      font-size:13px;
      background:rgba(255,255,255,.03);
    }
    .dot{
      width:8px;height:8px;border-radius:999px;
      background:rgba(255,91,91,.9);
      box-shadow:0 0 18px rgba(255,91,91,.55);
    }
    h1{
      margin:14px 0 6px;
      font-size:42px;
      letter-spacing:-.8px;
      line-height:1.05;
    }
    p{
      margin:0;
      color:var(--muted);
      line-height:1.55;
      max-width:70ch;
    }
    .actions{
      margin-top:18px;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }
    a.btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.04);
      color:var(--text);
      text-decoration:none;
      transition:transform .15s ease, background .15s ease, border-color .15s ease;
    }
    a.btn:hover{
      transform:translateY(-1px);
      background:rgba(255,255,255,.08);
      border-color:rgba(255,255,255,.2);
    }
    .hint{
      margin-top:14px;
      font-size:13px;
      color:rgba(255,255,255,.55);
      border-top:1px solid rgba(255,255,255,.10);
      padding-top:14px;
    }
    code{
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      color:rgba(255,255,255,.85);
    }
  </style>
</head>

<body>
  <main class="card">
    <span class="badge"><span class="dot"></span> Error 403 Prohibido</span>

    <h1>403</h1>
    <p>
      No tienes permisos para acceder a este recurso.
    </p>

    <div class="actions">
      <a class="btn" href="/"><span>Volver a Home</span></a>
      <a class="btn" href="/uploads/"><span>Ver Uploads</span></a>
    </div>
  </main>
</body>
</html>
